<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="200" viewBox="0 0 1200 200"><defs><style>.f{font-family:-apple-system, BlinkMacSystemFont, "SF Pro Display", "Segoe UI", "Helvetica Neue", Helvetica, Arial, sans-serif}.m{font-family:"SF Mono", SFMono-Regular, ui-monospace, Menlo, Consolas, "Liberation Mono", monospace}</style><linearGradient id="accent" x1="0" y1="0" x2="1" y2="0"><stop offset="0" stop-color="#F05138"/><stop offset="1" stop-color="#FF8A3D"/></linearGradient><linearGradient id="stroke" x1="0" y1="0" x2="1" y2="1"><stop offset="0" stop-color="#FFFFFF" stop-opacity=".14"/><stop offset=".5" stop-color="#FFFFFF" stop-opacity=".04"/><stop offset="1" stop-color="#FFFFFF" stop-opacity=".10"/></linearGradient><radialGradient id="g1" cx="0" cy="0" r="1" gradientUnits="userSpaceOnUse" gradientTransform="translate(600 220) scale(620 220)"><stop offset="0" stop-color="#F05138" stop-opacity=".35"/><stop offset=".6" stop-color="#8B5CF6" stop-opacity=".12"/><stop offset="1" stop-color="#8B5CF6" stop-opacity="0"/></radialGradient><style>.shine { animation: shine 5s ease-in-out infinite alternate; } @keyframes shine { from { opacity: .6 } to { opacity: 1 } }</style></defs><rect width="1200" height="200" rx="24" fill="#0B0B10"/><rect class="shine" width="1200" height="200" rx="24" fill="url(#g1)"/><rect x=".5" y=".5" width="1199" height="199" rx="23.5" fill="none" stroke="url(#stroke)"/><text x="600" y="92" text-anchor="middle" class="f" font-size="34" font-weight="800" letter-spacing="-1" fill="#F5F5F7">Let’s build something great together.</text><text x="600" y="130" text-anchor="middle" class="f" font-size="17" fill="#A1A1AA">Have an iOS idea or a role in mind? I’d love to hear about it.</text><rect x="540" y="156" width="120" height="3" rx="1.5" fill="url(#accent)"/></svg>
